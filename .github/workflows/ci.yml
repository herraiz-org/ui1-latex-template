name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: Lint shell scripts with shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint shell scripts with shellcheck
        run: shellcheck bin/*

  test:
    name: BATS and LaTeX tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ncurses (required by BATS pretty formatter)
        run: apk add --no-cache ncurses

      - name: Run BATS shell tests
        env:
          TERM: dumb
        run: bash tests/run_tests.sh tests/shell/*.bats

      - name: Compile LaTeX test documents
        run: make test
